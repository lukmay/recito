# keyd configuration for the TTS read-aloud hotkeys
# Target: /etc/keyd/default.conf
#
# Keyboard:
#   AltGr+P/O/L/I        -> Meta+Ctrl+letter        (read aloud / OCR / pause / auto)
#   AltGr+Shift+P/O      -> Meta+Ctrl+Shift+letter  (fast; Shift passes through to KDE)
#   Alt+AltGr+P/O/I      -> Meta+Ctrl+Alt+letter    (OCR variants; Alt passes through to KDE)
# Mouse:
#   2 side buttons (mouse1/mouse2) -> Meta+Ctrl+P / Meta+Ctrl+O (read aloud / OCR)
#
# No composite layers: the extra modifier (Shift or Alt) is passed through and
# KDE tells the variants apart by it.
#
# Other AltGr input (@, EUR sign, backslash, ...) and normal mouse use are unchanged.
#
# 'm:046d:c548' below is an example ID (a Logitech USB receiver). Replace it with
# the VID:PID of your own mouse: run 'sudo keyd monitor' and press a side button.
# keyd names the side buttons 'mouse1'/'mouse2' (browser back/forward otherwise).
#
# Apply changes:
#   sudo install -m644 keyd/default.conf /etc/keyd/default.conf && sudo keyd reload

[ids]
*
m:046d:c548

[main]
rightalt = layer(altgr)
mouse1 = M-C-p
mouse2 = M-C-o

[altgr:G]
p = M-C-p
o = M-C-o
l = M-C-l
i = M-C-i
