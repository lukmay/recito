# ============================================================================
#  TTS configuration for the piper-read daemon
# ============================================================================

# --- Local Piper voices (always offline, FALLBACK) --------------------------
# Mapping  <lang>=<onnx base name>  (file in ~/.local/share/piper/ on Linux,
# %APPDATA%\piper\ on Windows). These voices are loaded warm into RAM at start
# and take over whenever Edge TTS is off OR unreachable.
de=de_DE-thorsten-low
en=en_US-amy-low

# --- App language and setup assistant -----------------------------------------
#   ui_language=auto  -> menus and windows follow the system language
#   ui_language=en|de|fr|es|it -> fixed language (one file per language in bin/i18n/)
#   read_langs=de,en  -> languages you read, in order (missing: de,en). Offered:
#                        de en fr es it nl pt pl sv da cs ru tr. Language detection
#                        only chooses among these; each gets its own voice
#                        (<lang>= for Piper, <engine>_<lang>= for the others).
#                        A language the engine cannot speak is read by the Piper
#                        voice of that language, else online by Edge (not with
#                        engine=piper), else by the first Piper voice.
#   onboarded=1       -> set once the setup assistant was finished or skipped;
#                        remove the line to see the assistant again
ui_language=auto
read_langs=de,en

# --- Engine -----------------------------------------------------------------
#   engine=elevenlabs -> ElevenLabs (online, best quality, costs credits),
#                     Piper fallback. Quickest setup is in the tray.
#   engine=edge    -> Edge TTS (Microsoft Neural, online), Piper fallback
#   engine=kokoro2 -> Kokoro (local neural TTS, fast, also on the CPU),
#                     Piper fallback. Install with neural/kokoro2/setup.ps1 or
#                     setup.sh. The old engine=kokoro is read as kokoro2.
#   engine=piper   -> local Piper only (fully offline, robust)
#   engine=sapi    -> SAPI5 (classic Windows voices; Windows only), Piper fallback
#   engine=qwen3 | chatterbox | fish | stepaudio
#                  -> local neural servers on the GPU (neural/README.md),
#                     Piper fallback. Install each one separately with
#                     neural/<key>/setup.ps1 (Windows) or neural/<key>/setup.sh
#                     where present.
# Also switchable in the tray app or with  tts-engine.sh
engine=edge

# --- Fallback on engine errors ----------------------------------------------
#   fallback=piper -> a sentence the selected engine cannot deliver is spoken
#                     with the local Piper voice (default; the voice change
#                     mid-text is audible)
#   fallback=off   -> the voice NEVER changes: the sentence is retried once
#                     with sanitized text (special characters removed) and
#                     skipped otherwise. Also switchable in the tray menu.
fallback=piper

# --- Compute device ---------------------------------------------------------
#   device=cpu  -> Piper runs on the CPU (works everywhere, default)
#   device=gpu  -> Piper runs on CUDA if onnxruntime has the CUDA provider
#                  (onnxruntime-gpu), else on the CPU. The neural servers
#                  choose their device themselves.
# Windows loads CUDA/cuDNN from pip wheels (no system CUDA needed). Switchable
# in the tray menu ("Use GPU"); a change reloads the daemon.
device=cpu

# --- Automatic language detection (voice "auto") ----------------------------
#   lang_detect=text      -> detect the language ONCE for the whole selection
#                            (avoids flip-flopping on math or single words)
#   lang_detect=sentence  -> detect per sentence (for mixed-language text)
# In both modes fragments with fewer than 3 letters (numbers, symbols) do NOT
# trigger a switch. Switchable in the tray menu.
lang_detect=text

# --- Text clean-up -----------------------------------------------------------
# What the app removes or rewrites before reading (Markdown, Obsidian syntax,
# formulas, your own replacements) is one list of rules in rules.json next to
# this file. Change it in the settings window (Text clean-up) or with the
# tts-rules command line.
# Older versions had a line filters=obsidian,latex here. The app reads it once
# to switch the matching rule groups on, and ignores it after that; it can be
# deleted. Without such a line a new list starts with Markdown and formulas
# on and Obsidian off.

# --- Sentence pause ---------------------------------------------------------
# Extra silence AFTER each sentence, in milliseconds (applies to Edge AND Piper;
# the daemon splits at  . ! ? ... : ;  and line breaks). 0 = off (default).
# Edge voices already pause fairly naturally; 150-400 sounds calmer.
pause_sentence=0

# --- Latency: prebuffer (engines that render whole units) -------------------
# How much audio (in ms) is computed ahead before playback starts, for engines
# marked chunked in the daemon (none of the built-in engines currently).
# Streaming engines start with the first audio. Per machine (this file is local).
prebuffer_ms=1500

# --- Speed (length_scale) ---------------------------------------------------
# Smaller = faster: 0.8 reads at pace 1.25. speed_normal applies to AltGr+P/O,
# speed_fast to +Shift. Engines render the pace themselves where they can
# (Edge, Kokoro, Step-Audio, SAPI, ElevenLabs within 0.7-1.2); the rest
# (Piper, Chatterbox, Qwen3, Fish) is time-stretched with the pitch kept.
speed_normal=1.0
speed_fast=0.8

# --- Loudness ---------------------------------------------------------------
# Every engine and voice is normalized to loudness_target (LUFS, ITU-R
# BS.1770) with a peak limit of -1 dBFS. off = each engine at its own level.
loudness_norm=on
loudness_target=-18

# --- Edge TTS voices (online, very natural) ---------------------------------
# Format  edge_<key>=<Edge voice name>. The <key> matches the local Piper key
# above, so automatic language detection and fallback line up.
# Voice list:  ~/.local/share/piper-venv/bin/edge-tts --list-voices
edge_de=de-DE-KatjaNeural
edge_en=en-US-AriaNeural

# Alternatives (replace the value above):
#   German:   de-DE-ConradNeural (m), de-DE-AmalaNeural (f), de-DE-KillianNeural (m)
#   English:  en-US-GuyNeural (m), en-US-JennyNeural (f), en-GB-RyanNeural (m, UK)

# --- ElevenLabs (online; only with engine=elevenlabs) -----------------------
# The API key is NOT stored here but in elevenlabs.key in the same folder (or
# env ELEVENLABS_API_KEY). Get a key: https://elevenlabs.io/app/settings/api-keys
# Models (credits per character):
#   eleven_flash_v2_5      0.5  fast, cheap (default)
#   eleven_v4              1    newest, most lively model, no speed control
#   eleven_multilingual_v2 1    calm and stable on long texts
#   eleven_v3              1    predecessor of v4
# Voices = voice_id from your own account (the tray picks a narrator voice
# during setup). One voice speaks both languages.
# cache=on: stores heard sentences locally, repeats cost no credits.
elevenlabs_model=eleven_flash_v2_5
elevenlabs_cache=on
# elevenlabs_de=<voice_id>
# elevenlabs_en=<voice_id>

# --- Local neural servers (engine=kokoro2|qwen3|chatterbox|fish|stepaudio) ---
# Voice per language, empty = model default (list: settings window or
# neural/<key>/README.md). <key>_instruct = style direction or parameters
# (Qwen3: free text such as "calm, like an audiobook narrator"; syntax per model
# in its README). The server starts with the daemon and stops after
# neural_idle_min minutes without use (frees VRAM, 0 = never); the next sentence
# starts it again (load time a few seconds, depending on the model).
# kokoro2_de=thorsten
# kokoro2_en=af_heart
# qwen3_de=
# qwen3_en=
# qwen3_instruct=
# neural_idle_min=30
#
# GPU guard: a model starts only if its need (vram_mb in neural/models.json)
# fits the budget AND the reserve stays free afterwards. Only one model server
# runs at a time. Fish (~9.8 GB) and Step-Audio (~8.6 GB) exceed the default
# budget and are therefore blocked.
# neural_vram_max_mb=5500
# neural_vram_reserve_mb=3000

# --- SAPI5 voices (classic Windows voices; only with engine=sapi) -----------
# Value = substring of the voice name (e.g. 'Hedda', 'David', 'Zira'). Empty or
# missing = automatic choice of a de/en voice. Installed voices are listed in
# the tray (Voices tab) or the Windows speech settings.
# sapi_de=Hedda
# sapi_en=David

# --- MS Speech Platform (engine=mssp; Linux only) ---------------------------
# Plays the Speech Platform voices (ZiraPro, Hedda server, ...) directly as a
# child process through 'balcon' under Wine, no HTTP server. balcon uses the
# voices installed in the Wine prefix; speed goes through balcon's -s
# (length_scale is converted, so speed_normal/fast apply). Linux only; on
# Windows mssp is not offered.
#   mssp_cmd = balcon command line, e.g.  wine /home/<user>/balcon/balcon.exe
#              or the wrapper linux-mssp/balcon-mssp
#   mssp_de/mssp_en = voice name substring (empty = automatic choice by locale)
# mssp_cmd=wine /home/<user>/.local/share/balcon/balcon.exe
# mssp_de=Hedda
# mssp_en=ZiraPro
